<!DOCTYPE html>
<html lang="es">
<head>

<title>Verificador de Embarques — Cotización · Factura · Packing</title>

<style>
:root{
  --bg:#eef1f6; --bg2:#f4f6fa; --panel:#ffffff; --panel2:#f3f6fa;
  --line:#e4e9f0; --line2:#d2dae4;
  --ink:#1a2230; --ink2:#56616f; --ink3:#8a96a4;
  --cat:#eaa800; --cat-dim:#c98a00; --link:#a86a00;
  --ok:#0f8a57; --warn:#9a6b00; --bad:#c62f2f; --info:#2563c9;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 10px 28px -16px rgba(16,24,40,.18);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'IBM Plex Sans',system-ui,sans-serif;
  --disp:'Bricolage Grotesque',var(--sans);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:
    radial-gradient(1100px 520px at 100% -8%, rgba(234,168,0,.07), transparent 60%),
    radial-gradient(800px 460px at -8% 108%, rgba(37,99,217,.05), transparent 55%),
    var(--bg);
  color:var(--ink); font-family:var(--sans); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.app{display:grid; grid-template-columns:240px 1fr; height:100vh}
/* ---------- sidebar ---------- */
.side{
  background:linear-gradient(180deg,#ffffff,var(--bg2));
  border-right:1px solid var(--line); padding:20px 14px; display:flex; flex-direction:column; gap:6px;
}
.brand{display:flex; align-items:center; gap:11px; padding:4px 8px 18px}
.brand .mark{
  width:36px; height:36px; border-radius:9px; flex:none;
  background:linear-gradient(135deg,var(--cat),var(--cat-dim));
  display:grid; place-items:center; color:#241a00; font-weight:800; font-family:var(--disp);
  box-shadow:0 6px 16px -8px rgba(234,168,0,.7);
}
.brand h1{font:800 15px/1.1 var(--disp); margin:0; letter-spacing:.2px; color:var(--ink)}
.brand span{font-size:10.5px; color:var(--ink3); text-transform:uppercase; letter-spacing:1.6px}
.nav{display:flex; flex-direction:column; gap:3px; margin-top:6px}
.nav button{
  all:unset; cursor:pointer; display:flex; align-items:center; gap:11px;
  padding:10px 11px; border-radius:10px; color:var(--ink2); font-weight:500; font-size:13px;
  transition:background .12s,color .12s;
}
.nav button svg{width:17px; height:17px; opacity:.7}
.nav button:hover{background:var(--panel2); color:var(--ink)}
.nav button.on{background:#fff7e6; color:#7a4e00; box-shadow:inset 3px 0 0 var(--cat), var(--shadow)}
.nav button.on svg{opacity:1; color:var(--cat-dim)}
.side .grow{flex:1}
.side .foot{font-size:10.5px; color:var(--ink3); padding:8px; line-height:1.55; border-top:1px solid var(--line)}
.side .foot b{color:var(--link)}
/* ---------- main ---------- */
.main{overflow:auto; padding:32px 40px 80px}
.head{margin-bottom:24px}
.head h2{font:800 27px/1.1 var(--disp); margin:0 0 7px; letter-spacing:-.4px; color:var(--ink)}
.head p{margin:0; color:var(--ink2); max-width:700px}
.kicker{font:700 11px/1 var(--sans); text-transform:uppercase; letter-spacing:2px; color:var(--link); margin-bottom:10px}
.panel{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px; box-shadow:var(--shadow)}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px}

@media(max-width:1100px){.grid3,.grid4{grid-template-columns:1fr 1fr}}

.slot{

.slot:hover{border-color:var(--cat-dim)}

/* ---------- carpetas / breadcrumb ---------- */
.crumb{display:flex;gap:9px;align-items:center;font-size:12.5px;color:var(--ink3);margin-bottom:16px}

.chip.has{background:#f0faf5;color:#0c7048;border-color:#c5ead8}
.addcard{background:transparent;border:1.5px dashed var(--line2);border-radius:13px;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;cursor:pointer;color:var(--ink3);min-height:140px;transition:.13s;font-weight:600;font-size:13px}

<body>
<div class="app">
  <!-- ============ SIDEBAR ============ -->
  <aside class="side">
    <div class="brand">
      <div class="mark">PT</div>
      <div>
        <h1>Verificador</h1>
        <span>Embarques</span>
      </div>
    </div>
    <nav class="nav" id="nav">
      <button data-v="prov" class="on">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        Proveedores
      </button>
      <button data-v="reportes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>
        Reportes
      </button>
      <button data-v="equiv">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 8l-4 4 4 4M17 8l4 4-4 4M14 4l-4 16"/></svg>
        Equivalencias
      </button>
    </nav>
    <div class="grow"></div>
    <div class="foot">
      Datos guardados en <b>este equipo/navegador</b> (IndexedDB). Exporta tu tabla de equivalencias para respaldarla.
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <main class="main" id="main"></main>

<div class="toast" id="toast"></div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const ICON = {
  doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.4 2.4 4.6-5"/></svg>',
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>'
};

/* ============================================================
   DB — IndexedDB minimal wrapper
   ============================================================ */
const DB = (()=>{
  let db;
  const open = ()=>new Promise((res,rej)=>{
    const r = indexedDB.open('verificador_embarques',1);
    r.onupgradeneeded = e=>{
      const d = e.target.result;
      if(!d.objectStoreNames.contains('ops')) d.createObjectStore('ops',{keyPath:'id'});
      if(!d.objectStoreNames.contains('crossref')) d.createObjectStore('crossref',{keyPath:'id'});
      if(!d.objectStoreNames.contains('prov')) d.createObjectStore('prov',{keyPath:'id'});
    };
    r.onsuccess = e=>{db=e.target.result; res();};
    r.onerror = e=>rej(e);
  });
  const tx = (store,mode)=>db.transaction(store,mode).objectStore(store);
  const all = store=>new Promise(res=>{const out=[];const c=tx(store,'readonly').openCursor();c.onsuccess=e=>{const cur=e.target.result;if(cur){out.push(cur.value);cur.continue();}else res(out);};});
  const put = (store,val)=>new Promise(res=>{tx(store,'readwrite').put(val).onsuccess=()=>res();});
  const del = (store,id)=>new Promise(res=>{tx(store,'readwrite').delete(id).onsuccess=()=>res();});
  return {open,all,put,del};
})();

/* ============================================================
   NORMALIZACIÓN Y EMPAREJAMIENTO DE CÓDIGOS
   ============================================================ */
const Codes = {
  norm(raw){ return String(raw==null?'':raw).toUpperCase().replace(/[\s\-\._\/]+/g,'').trim(); },
  split(normd){
    const m = normd.match(/^(.*?)([A-Z]{2,4})$/);
    if(m && /\d$/.test(m[1]) && m[1].length>=3) return {base:m[1], brand:m[2]};
    return {base:normd, brand:''};
  },
  // Forma de número de parte: 6-8 dígitos, o 6 con letra en 2da posición (ej. 0L1026)
  isPartNumber(base){ return /^\d{6,8}$/.test(base) || /^[0-9][A-Z][0-9]{4}$/.test(base); },
  // Llave de comparación: ignora ceros a la izquierda SOLO en códigos numéricos
  // (0931436 y 931436 = mismo ítem) pero respeta los que llevan letra (0L1026 intacto)
  canon(base){ return /^\d+$/.test(base) ? (base.replace(/^0+/,'')||'0') : base; },
  resolveKey(rawCode, provId, crossref){
    const n = this.norm(rawCode);
    const {base} = this.split(n);
    if(this.isPartNumber(base)) return {key:this.canon(base), status:'auto', shown:base};
    const hit = crossref.find(c=>c.provId===provId && (c.alien===n || c.alien===base || this.canon(c.alien)===this.canon(base)));
    if(hit) return {key:this.canon(this.split(this.norm(hit.canonical)).base), status:'mapped', shown:hit.canonical};
    return {key:'?'+n, status:'unknown', shown:n};
  }
};

/* ============================================================
   PARSERS — Excel (SheetJS) y PDF (pdf.js)
   ============================================================ */
async function readExcel(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf,{type:'array'});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
  return {kind:'excel', rows};
}
async function readPDF(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data:buf}).promise;
  const lines = [];
  for(let p=1;p<=pdf.numPages;p++){
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    const byY = {};
    tc.items.forEach(it=>{ const y=Math.round(it.transform[5]); (byY[y]=byY[y]||[]).push({x:it.transform[4],s:it.str}); });
    Object.keys(byY).map(Number).sort((a,b)=>b-a).forEach(y=>{
      const txt = byY[y].sort((a,b)=>a.x-b.x).map(o=>o.s).join('  ').replace(/\s+/g,' ').trim();
      if(txt) lines.push(txt);
    });
  }
  const full = lines.join('\n');
  const isCostex = /COSTEX/i.test(full);
  let guess=[];
  if(isCostex){
    // COSTEX:  Pc/Sp  Qty  PartNo  Description  Checking(7d)  Lc(2d)  Order  Item  Cust.P.O.
    // Tomamos solo Qty, PartNo, Description y Cust.P.O.  (el resto se ignora)
    const re=/^(\d+\/\d+)\s+(\d+)\s+(\S+)\s+(.+?)\s+(\d{7})\s+(\d{2})\s+(\d+)\s+(\d+)\s+(OC\b.*?)\s*$/;
    lines.forEach(l=>{ const m=l.match(re); if(m) guess.push({raw:l, qty:m[2], code:m[3], desc:m[4].trim(), po:m[9].trim()}); });
  }
  if(!guess.length){
    guess = lines.map(l=>{ const codeM=l.match(/\b([0-9][A-Z]?[0-9]{3,7}[A-Z]{0,4})\b/); return {raw:l, code:codeM?codeM[1]:'', qty:'', desc:l}; });
  }
  return {kind:'pdf', rows:lines, guess, costex:isCostex};
}

/* ============================================================
   ESTADO
   ============================================================ */
let state = { view:'prov', prov:[], crossref:[], ops:[], curProvId:null, cur:null };
function newOp(provId){
  const p = state.prov.find(x=>x.id===provId);
  return { id:'op_'+Date.now(), provId, provName:p?p.name:'', ref:'',
           fecha:new Date().toISOString().slice(0,10),
           docs:{cotizacion:null, factura:null, packing:null} };
}
const IC2 = {
  folder:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};

/* ============================================================
   COMPARADOR
   ============================================================ */
function buildIndex(items, provId){
  const idx = {};
  (items||[]).forEach(it=>{
    const r = Codes.resolveKey(it.code, provId, state.crossref);
    const k = r.key;
    if(!idx[k]) idx[k] = {key:k, shown:r.shown, status:r.status, codes:new Set(), qty:0, price:null, desc:it.desc||''};
    idx[k].codes.add(Codes.norm(it.code));
    if(r.shown && r.shown.length>idx[k].shown.length) idx[k].shown=r.shown;
    idx[k].qty += Number(it.qty)||0;
    if(it.price!=null && it.price!=='') idx[k].price = Number(it.price);
    if(!idx[k].desc && it.desc) idx[k].desc = it.desc;
  });
  return idx;
}
function compare(idxA, idxB, labelA, labelB){
  const keys = new Set([...Object.keys(idxA),...Object.keys(idxB)]);
  const rows = [];
  keys.forEach(k=>{
    const a=idxA[k], b=idxB[k]; let status,sev;
    if(a&&!b){status='Falta en '+labelB;sev='bad';}
    else if(!a&&b){status='Extra en '+labelB;sev='warn';}
    else{ if(a.qty===b.qty){status='OK';sev='ok';} else {status='Cantidad distinta';sev='bad';} }
    rows.push({key:k,shown:(a&&a.shown)||(b&&b.shown)||k,qtyA:a?a.qty:null,qtyB:b?b.qty:null,status,sev});
  });
  return rows;
}
// Reporte completo de una Orden de Compra: pedido vs factura vs packing + backorder
function ocReport(op){
  const ped = buildIndex(op.docs.cotizacion?.items, op.provId);
  const fac = buildIndex(op.docs.factura?.items, op.provId);
  const pak = buildIndex(op.docs.packing?.items, op.provId);
  const hasPed=!!op.docs.cotizacion, hasFac=!!op.docs.factura, hasPak=!!op.docs.packing;
  const keys=new Set([...Object.keys(ped),...Object.keys(fac),...Object.keys(pak)]);
  const rows=[]; const unknowns={};
  keys.forEach(k=>{
    const P=ped[k],F=fac[k],K=pak[k];
    const qP=P?P.qty:0, qF=F?F.qty:0, qK=K?K.qty:0;
    const shown=(P&&P.shown)||(F&&F.shown)||(K&&K.shown)||k;
    const desc=(P&&P.desc)||(F&&F.desc)||(K&&K.desc)||'';
    const unknown=(P&&P.status==='unknown')||(F&&F.status==='unknown')||(K&&K.status==='unknown');
    const back = hasPed ? Math.max(qP-qF,0) : 0;
    let status,sev;
    if(hasPed && qP>0){
      if(!hasFac){status='Pedido';sev='mut';}
      else if(qF===0){status='Backorder total';sev='bad';}
      else if(qF<qP){status='Backorder parcial';sev='warn';}
      else if(qF>qP){status='Enviado de más';sev='warn';}
      else{status='Completo';sev='ok';}
    } else if(qF>0){status='Extra (no pedido)';sev='warn';}
    else {status='—';sev='mut';}
    const packDiff = (hasFac&&hasPak&&qF!==qK);
    if(unknown){ const c=[...(P?P.codes:F?F.codes:K.codes)][0]; unknowns[c]={code:c,desc,from:P?'pedido':F?'factura':'packing'}; }
    rows.push({key:k,shown,desc,qP,qF,qK,back,status,sev,packDiff,unknown,hasPed,hasFac,hasPak});
  });
  const order={bad:0,warn:1,mut:3,ok:2};
  rows.sort((a,b)=>order[a.sev]-order[b.sev]||b.back-a.back||a.shown.localeCompare(b.shown));
  return {rows, unknowns:Object.values(unknowns), hasPed,hasFac,hasPak};
}

/* ---------- carga de archivos ---------- */
async function handleFile(key,file){ if(!file)return; toast('Leyendo '+file.name+'…');
  try{ const isPdf=/\.pdf$/i.test(file.name); const parsed=isPdf?await readPDF(file):await readExcel(file);
    state.cur.docs[key]={fileName:file.name,items:[],_parsed:parsed}; if(parsed.costex)toast('Formato COSTEX detectado'); openReview(key);
  }catch(err){console.error(err);toast('No se pudo leer el archivo');}
}

/* ---------- revisión / mapeo ---------- */
let reviewMap={code:-1,desc:-1,qty:-1,price:-1}, reviewHeaderRow=0;
function guessCol(headers,opts){for(let i=0;i<headers.length;i++){const h=String(headers[i]).toLowerCase();if(opts.some(o=>h.includes(o)))return i;}return -1;}
function openReview(key){
  const doc=state.cur.docs[key]; const labels={cotizacion:'Pedido / Confirmación',factura:'Factura',packing:'Packing List'};
  if(doc._parsed && doc._parsed.kind==='excel') renderExcelReview(key,doc._parsed,labels[key]);
  else if(doc._parsed && doc._parsed.kind==='pdf') renderPdfReview(key,doc._parsed,labels[key]);
  else renderItemsEdit(key,labels[key]); // doc ya confirmado: editar líneas existentes
}
function renderExcelReview(key,parsed,label){
  const rows=parsed.rows; let hr=0;
  for(let i=0;i<Math.min(rows.length,15);i++){if(rows[i].filter(c=>String(c).trim()).length>=3){hr=i;break;}}
  reviewHeaderRow=hr; const headers=rows[hr]||[];
  reviewMap={code:guessCol(headers,['codigo','code','parte','part','item','sku','nro','n°']),
    desc:guessCol(headers,['descrip','desc','detalle','nombre','articulo','product']),
    qty:guessCol(headers,['cant','qty','quantity','unid','und','pcs']),
    price:guessCol(headers,['precio','price','unit','valor','costo'])};
  const colOpts=headers.map((h,i)=>`${i}: ${esc(String(h).slice(0,22))||'(col '+(i+1)+')'}`);
  const sel=f=>`<select class="t" data-map="${f}"><option value="-1">— ninguna —</option>${colOpts.map((o,i)=>`<option value="${i}" ${reviewMap[f]===i?'selected':''}>${o}</option>`).join('')}</select>`;
  const preview=rows.slice(hr,hr+40);
  main.innerHTML=`
    <div class="head"><div class="kicker">Revisión · ${label}</div><h2>Mapea las columnas</h2>
      <p>Indica qué columna del Excel corresponde a cada campo. Encabezado detectado en la fila ${hr+1}.</p></div>
    <div class="panel" style="margin-bottom:16px">
      <div class="mapbar">
        <div><label class="f">Código *</label>${sel('code')}</div><div><label class="f">Descripción</label>${sel('desc')}</div>
        <div><label class="f">Cantidad *</label>${sel('qty')}</div><div><label class="f">Precio unit.</label>${sel('price')}</div>
      </div>
      <div class="row"><button class="btn primary" id="confirmExcel">Confirmar líneas →</button><button class="btn ghost" id="cancelRev">Cancelar</button></div>
    </div>
    <div class="tblwrap"><table class="tbl"><thead><tr>${headers.map((h,i)=>`<th>${i}<br>${esc(String(h).slice(0,18))}</th>`).join('')}</tr></thead>
    <tbody>${preview.slice(1).map(rw=>`<tr>${headers.map((_,i)=>`<td>${esc(String(rw[i]??'').slice(0,28))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  main.querySelectorAll('[data-map]').forEach(s=>s.onchange=e=>reviewMap[e.target.dataset.map]=Number(e.target.value));
  $('#cancelRev').onclick=()=>{state.cur.docs[key]=null;state.view='oc';render();};
  $('#confirmExcel').onclick=async()=>{
    if(reviewMap.code<0||reviewMap.qty<0){toast('Asigna al menos Código y Cantidad');return;}
    const items=[]; rows.slice(reviewHeaderRow+1).forEach(rw=>{const code=String(rw[reviewMap.code]??'').trim(); if(!code)return;
      items.push({code, desc:reviewMap.desc>=0?String(rw[reviewMap.desc]??''):'', qty:reviewMap.qty>=0?(parseFloat(String(rw[reviewMap.qty]).replace(',','.'))||0):0, price:reviewMap.price>=0?(parseFloat(String(rw[reviewMap.price]).replace(',','.'))||null):null});});
    state.cur.docs[key].items=items; delete state.cur.docs[key]._parsed; await DB.put('ops',state.cur);
    toast(items.length+' líneas confirmadas'); state.view='oc'; render();};
}
function renderPdfReview(key,parsed,label){
  const init=parsed.guess.filter(g=>g.code).map(g=>({code:g.code,desc:(g.desc||'').slice(0,60),qty:g.qty||''}));
  const rows=init.length?init:[{code:'',desc:'',qty:''}];
  const pos=[...new Set(parsed.guess.map(g=>g.po).filter(Boolean))];
  const sub = parsed.costex
    ? `Formato <b>COSTEX</b> detectado: ${init.length} líneas leídas automáticamente (Qty · Part No · Description).${pos.length?' Pedido(s): <b>'+pos.map(esc).join(', ')+'</b>.':''} Revisa y confirma.`
    : `Lectura aproximada del PDF. Corrige códigos y escribe las cantidades.`;
  buildGrid(key,label,rows,sub,
    `<details class="panel"><summary class="muted small" style="cursor:pointer">Ver texto crudo extraído (${parsed.rows.length} líneas)</summary><pre style="white-space:pre-wrap;font-family:var(--mono);font-size:11px;color:var(--ink2);max-height:300px;overflow:auto;margin-top:12px">${esc(parsed.rows.join('\n'))}</pre></details>`);
}
function renderItemsEdit(key,label){
  const rows=state.cur.docs[key].items.map(i=>({code:i.code,desc:i.desc||'',qty:i.qty}));
  buildGrid(key,label,rows.length?rows:[{code:'',desc:'',qty:''}],`Edita las líneas guardadas de este documento.`,'');
}
function buildGrid(key,label,rows,subtitle,extra){
  state.cur.docs[key]._edit=rows;
  const grid=()=>`<table class="tbl editgrid"><thead><tr><th style="width:170px">Código</th><th>Descripción</th><th style="width:110px">Cantidad</th><th style="width:40px"></th></tr></thead><tbody id="pgrid">${rows.map((r,i)=>pdfRow(r,i)).join('')}</tbody></table>`;
  main.innerHTML=`
    <div class="head"><div class="kicker">Revisión · ${label}</div><h2>Confirma las líneas</h2><p>${subtitle}</p></div>
    <div class="panel" style="margin-bottom:16px">
      <div class="tblwrap" style="max-height:420px">${grid()}</div>
      <div class="row" style="margin-top:14px"><button class="btn ghost sm" id="addRow">＋ Fila</button><div style="flex:1"></div>
        <button class="btn primary" id="confirmGrid">Confirmar líneas →</button><button class="btn ghost" id="cancelRev">Cancelar</button></div>
    </div>${extra}`;
  const bind=()=>{main.querySelectorAll('#pgrid input').forEach(inp=>inp.oninput=e=>{rows[+e.target.dataset.i][e.target.dataset.f]=e.target.value;});
    main.querySelectorAll('#pgrid [data-del]').forEach(b=>b.onclick=()=>{rows.splice(+b.dataset.del,1);refresh();});};
  const refresh=()=>{$('#pgrid').innerHTML=rows.map((r,i)=>pdfRow(r,i)).join('');bind();};
  bind();
  $('#addRow').onclick=()=>{rows.push({code:'',desc:'',qty:''});refresh();};
  $('#cancelRev').onclick=()=>{ if(!state.cur.docs[key].items.length) state.cur.docs[key]=null; else {delete state.cur.docs[key]._parsed; delete state.cur.docs[key]._edit;} state.view='oc';render();};
  $('#confirmGrid').onclick=async()=>{const items=rows.filter(r=>String(r.code).trim()).map(r=>({code:r.code.trim(),desc:r.desc,qty:parseFloat(String(r.qty).replace(',','.'))||0,price:null}));
    if(!items.length){toast('Agrega al menos una línea con código');return;}
    state.cur.docs[key].items=items; delete state.cur.docs[key]._parsed; delete state.cur.docs[key]._edit; await DB.put('ops',state.cur);
    toast(items.length+' líneas confirmadas'); state.view='oc'; render();};
}
function pdfRow(r,i){return `<tr>
  <td><input class="codecol" data-i="${i}" data-f="code" value="${esc(r.code)}"></td>
  <td><input data-i="${i}" data-f="desc" value="${esc(r.desc)}"></td>
  <td><input data-i="${i}" data-f="qty" value="${esc(r.qty)}" style="text-align:right;font-family:var(--mono)"></td>
  <td><button class="btn ghost sm" data-del="${i}" style="padding:4px 9px">✕</button></td></tr>`;}

function quickMap(provId,alien){
  const canonical=prompt(`Código "${alien}" del proveedor equivale a tu código SAP/internacional:\n(escribe el código base, ej. 2390559 o 1R0750)`);
  if(!canonical)return; const c={id:'cr_'+Date.now(),provId,alien:Codes.norm(alien),canonical:Codes.split(Codes.norm(canonical)).base};
  state.crossref.push(c); DB.put('crossref',c); toast('Equivalencia guardada'); render();
}

/* ---------- REPORTES ---------- */
function vReportes(){
  let totBack=0, per={};
  state.ops.forEach(o=>{const r=ocReport(o); const b=r.rows.filter(x=>x.back>0).length; totBack+=b; const k=o.provName||'?'; (per[k]=per[k]||{ops:0,back:0}); per[k].ops++; per[k].back+=b;});
  main.innerHTML=`<div class="head"><div class="kicker">Indicadores</div><h2>Reportes</h2><p>Resumen de órdenes y backorders por proveedor.</p></div>
    <div class="grid4" style="margin-bottom:18px">
      <div class="kpi"><div class="v">${state.ops.length}</div><div class="l">Órdenes de compra</div></div>
      <div class="kpi warn"><div class="v">${totBack}</div><div class="l">Ítems en backorder</div></div>
      <div class="kpi info"><div class="v">${state.crossref.length}</div><div class="l">Equivalencias</div></div>
      <div class="kpi"><div class="v">${state.prov.length}</div><div class="l">Proveedores</div></div>
    </div>
    <div class="sec-title">Backorder por proveedor<span class="ln"></span></div>
    ${Object.keys(per).length?`<div class="tblwrap"><table class="tbl"><thead><tr><th>Proveedor</th><th class="num">Órdenes</th><th class="num">Ítems en backorder</th></tr></thead><tbody>
    ${Object.entries(per).map(([n,v])=>`<tr><td>${esc(n)}</td><td class="num">${v.ops}</td><td class="num">${v.back}</td></tr>`).join('')}
    </tbody></table></div>`:`<div class="empty"><div class="ic">—</div>Sin datos todavía.</div>`}`;
}

/* ---------- EQUIVALENCIAS ---------- */
function vEquiv(){
  main.innerHTML=`<div class="head between"><div><div class="kicker">Tabla de cruce</div><h2>Equivalencias de códigos</h2>
    <p>Mapea el código de un proveedor (código de cambio o local) a tu código internacional/SAP. El sistema lo usará automáticamente.</p></div>
    <div class="row"><button class="btn ghost sm" id="impEq">Importar</button><button class="btn ghost sm" id="expEq">Exportar</button></div></div>
    <div class="panel" style="margin-bottom:16px"><div class="mapbar" style="grid-template-columns:1.2fr 1fr 1fr auto;align-items:end">
      <div><label class="f">Proveedor</label><select class="t" id="eqProv"><option value="">—</option>${state.prov.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>
      <div><label class="f">Código del proveedor</label><input class="t" id="eqAlien" placeholder="Ej. 38N-1234"></div>
      <div><label class="f">Tu código (internacional)</label><input class="t" id="eqCanon" placeholder="Ej. 2390559"></div>
      <div><button class="btn primary" id="eqAdd">＋ Agregar</button></div></div></div>
    ${state.crossref.length?`<div class="tblwrap"><table class="tbl"><thead><tr><th>Proveedor</th><th>Código proveedor</th><th>→</th><th>Código internacional</th><th></th></tr></thead><tbody>
    ${state.crossref.map(c=>{const p=state.prov.find(x=>x.id===c.provId);return `<tr><td>${esc(p?p.name:'?')}</td><td class="code">${esc(c.alien)}</td><td class="muted">→</td><td class="code" style="color:var(--link)">${esc(c.canonical)}</td><td><button class="btn ghost sm" data-del="${c.id}">✕</button></td></tr>`;}).join('')}
    </tbody></table></div>`:`<div class="empty"><div class="ic">—</div>Sin equivalencias todavía.</div>`}`;
  $('#eqAdd').onclick=()=>{const provId=$('#eqProv').value,alien=$('#eqAlien').value.trim(),canon=$('#eqCanon').value.trim();
    if(!provId||!alien||!canon){toast('Completa los 3 campos');return;}
    const c={id:'cr_'+Date.now(),provId,alien:Codes.norm(alien),canonical:Codes.split(Codes.norm(canon)).base};state.crossref.push(c);DB.put('crossref',c);render();};
  main.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{await DB.del('crossref',b.dataset.del);state.crossref=state.crossref.filter(c=>c.id!==b.dataset.del);render();});
  $('#expEq').onclick=()=>{const blob=new Blob([JSON.stringify({prov:state.prov,crossref:state.crossref},null,2)],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='equivalencias.json';a.click();};
  $('#impEq').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async e=>{const j=JSON.parse(await e.target.files[0].text());for(const p of(j.prov||[])){if(!state.prov.find(x=>x.id===p.id)){state.prov.push(p);await DB.put('prov',p);}}for(const c of(j.crossref||[])){if(!state.crossref.find(x=>x.id===c.id)){state.crossref.push(c);await DB.put('crossref',c);}}toast('Importado');render();};i.click();};
}

/* ---------- EXPORT EXCEL ---------- */
function exportOC(op,r){
  const wb=XLSX.utils.book_new();
  const res=[['Codigo','Descripcion','Pedido','Facturado','Empacado','Backorder','Estado']];
  r.rows.forEach(x=>res.push([x.shown,x.desc,x.hasPed?x.qP:'',x.hasFac?x.qF:'',x.hasPak?x.qK:'',x.back,x.status+(x.packDiff?' / != packing':'')]));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(res),'Resumen OC');
  const back=r.rows.filter(x=>x.back>0).map(x=>[x.shown,x.desc,x.qP,x.qF,x.back]);
  if(back.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Codigo','Descripcion','Pedido','Facturado','Backorder'],...back]),'Backorder');
  if(r.unknowns.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Codigo','Descripcion','Documento'],...r.unknowns.map(u=>[u.code,u.desc,u.from])]),'Sin equivalencia');
  XLSX.writeFile(wb,`OC_${(op.ref||op.id).replace(/[^\w\-]/g,'_')}.xlsx`);
}

/* ============================================================
   INIT
   ============================================================ */
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state.view=b.dataset.v; if(b.dataset.v==='prov')state.curProvId=null; render();});
(async()=>{
  await DB.open();
  state.prov=await DB.all('prov');
  state.crossref=await DB.all('crossref');
  state.ops=(await DB.all('ops')).sort((a,b)=>b.id.localeCompare(a.id));
  render();
})();
</script>
